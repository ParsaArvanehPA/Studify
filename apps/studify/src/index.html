<!doctype html>
<html lang="en" data-mood="midnight">
    <head>
        <meta charset="utf-8" />
        <title>Studify</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Studify — a calm, unified reader for university study materials." />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
        <link rel="mask-icon" href="favicon.svg" color="#E6B557" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#0B0D12" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Studify" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            rel="stylesheet"
        />
    </head>
    <body>
        <script>
            try {
                document.documentElement.dataset.mood = localStorage.getItem('studify:mood') || 'midnight';
            } catch (e) {}
        </script>
        <studify-root></studify-root>
    </body>
</html>
