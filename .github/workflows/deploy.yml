name: Deploy to GitHub Pages

# Site is published from the `docs/` folder on `main` (Pages "Deploy from a
# branch"). This workflow is an optional alternative: switch Pages Source to
# "GitHub Actions" and run it manually to publish straight from the build.
on:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: touch dist/apps/studify/browser/.nojekyll
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist/apps/studify/browser

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
